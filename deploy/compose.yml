# The homelab stack (Dokploy compose app). Cloudflare's tunnel terminates TLS and hands plain HTTP
# to Traefik, which routes aftergrowth.davideghiotto.it here by its Dokploy domain record.
services:
  # not called "web" or "app": service names are shared by every stack on dokploy-network
  aftergrowth:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA: /data/world.json
    volumes:
      - aftergrowth-data:/data
    networks:
      - dokploy-network

volumes:
  aftergrowth-data:
    name: aftergrowth-data

networks:
  dokploy-network:
    external: true
